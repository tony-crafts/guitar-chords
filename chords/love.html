<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>love. — 기타 코드</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="54" font-size="82" text-anchor="middle" dominant-baseline="central">🎸</text></svg>'>
<style>
:root{
  --bg:#14120e; --panel:#1c1913; --line:#35301f;
  --text:#ece4d2; --dim:#988e79; --gold:#f0a83a; --brg:#e07b5f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;
  padding:12px 12px calc(24px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto;
}
header{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:2px 2px 10px}
header h1{font-size:22px; letter-spacing:.5px; color:var(--gold); font-weight:800}
header .meta{font-size:11.5px; color:var(--dim); letter-spacing:.4px}
.back{display:inline-block; font-size:11.5px; color:var(--dim); text-decoration:none; margin-bottom:8px}
.back:hover{color:var(--gold)}
.pvid{
  position:relative; width:100%; aspect-ratio:16/9;
  background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden;
  margin-bottom:10px;
}
.pvid iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px 12px; margin-bottom:9px;
}
.panel h2{font-size:12px; font-weight:800; color:var(--gold); letter-spacing:.4px}
.panel .cap{font-size:10.5px; color:var(--dim); margin-top:2px; line-height:1.5}
footer{margin-top:14px; font-size:10px; color:#6b6250; line-height:1.6; padding:0 2px}
</style>
</head>
<body>

<a class="back" href="/index.html">‹ 목록</a>

<header>
  <h1>love.</h1>
  <span class="meta">wave to earth · 영상 연습</span>
</header>

<div class="pvid"><div id="ytPlayer"></div></div>

<div class="panel">
  <div id="loveSpeed"></div>
</div>

<div class="panel">
  <h2>A-B 구간 루프</h2>
  <div class="cap">재생 중 [A 설정]·[B 설정]로 구간을 잡고 [루프 ON] — B에 닿으면 A로 되돌아갑니다.</div>
  <div id="loveLoop"></div>
</div>

<footer>차트·마디 싱크 없이 영상 반복 연습용 페이지입니다. 속도·구간 설정은 이 기기에 저장됩니다.</footer>

<script src="practice.js"></script>
<script>
const VIDEO_ID = 'WE_QHvDcgiY';        // love. — wave to earth
let player = null, ready = false, apiRequested = false;

// 컨트롤은 로드 시 생성(플레이어는 아직 없음 → onReady에서 연결)
const speedCtl = Practice.createSpeed({
  mount: document.getElementById('loveSpeed'),
  storageKey: 'love_speed',
  getPlayer: () => player
});
const loopCtl = Practice.createLoop({
  mount: document.getElementById('loveLoop'),
  storageKey: 'love_ab',
  getPlayer: () => player
});

function initPlayer(){
  if(player || apiRequested) return;
  apiRequested = true;
  if(window.YT && window.YT.Player){ createPlayer(); return; }
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = createPlayer;

function createPlayer(){
  if(player) return;
  player = new YT.Player('ytPlayer', {
    videoId: VIDEO_ID,
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: function(){
        if(ready) return;   // onReady 중복 발화 방지
        ready = true;
        speedCtl.onReady();
        loopCtl.onReady();
      },
      onPlaybackRateChange: function(e){ speedCtl.onPlaybackRateChange(e.data); }
    }
  });
}

initPlayer();
</script>
</body>
</html>
